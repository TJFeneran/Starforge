name: Protect main

# Free-plan private repos cannot use branch protection / rulesets, so this
# workflow flags direct (non-PR) pushes to main. Collaborators should work on
# a branch and open a pull request instead.

on:
  push:
    branches: [main]

jobs:
  check-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on direct push to main
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Direct push to main by $ACTOR. Work on a branch and open a pull request."
            exit 1
          fi
          echo "Push by repo owner $ACTOR; allowed."
